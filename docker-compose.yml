# Docker Compose for local development
# Runs only the backend - frontend runs natively with npm run dev

services:
  ai:
    build:
      context: ./services/ai
      target: development
    ports:
      - "8081:8081"
    volumes:
      - ./services/ai/src:/app/src:cached
      - ./services/ai/tests:/app/tests:cached
    env_file:
      - ./services/ai/.env
    environment:
      - ENVIRONMENT=development
      # Fix for file watching on macOS Docker volumes
      - WATCHFILES_FORCE_POLLING=true

